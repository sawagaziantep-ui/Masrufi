<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق إدارة المهام والأموال</title>
    <!-- Font Preload & Style -->
    <style>
        @font-face {
            font-family: 'Tajawal';
            src: url('tajawal.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --income-color: #16a34a;
            --expense-color: #dc2626;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        /* Landmark & Accessibility */
        main {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Print Settings */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            body {
                background: white;
                padding: 0;
            }
        }

        /* UI Customizations */
        
        /* 1. Main Page: Enlarged circle and text by 15% */
        .hero-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            transform: scale(1.15);
            transform-origin: center;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            transition: transform 0.2s ease;
        }

        /* 2. Movements Page: reduced padding/margins by 50% */
        .movements-container {
            display: grid;
            gap: 8px;
            margin: 10px 0;
        }

        .movement-icon-card {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            margin: 4px 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .movement-icon-card .icon {
            font-size: 1.2rem;
            margin-left: 8px;
        }

        /* 3. Input Page: Income card scaled down by 10% */
        .input-card-income {
            background: #f0fdf4;
            border: 2px solid var(--income-color);
            border-radius: 12px;
            padding: 16px;
            transform: scale(0.90);
            transform-origin: center;
            margin: 10px auto;
        }

        .input-card-expense {
            background: #fef2f2;
            border: 2px solid var(--expense-color);
            border-radius: 12px;
            padding: 16px;
            margin: 10px auto;
        }

        button, input, select {
            font-size: 1rem;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        button {
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
        }

        button:focus-visible, a:focus-visible, input:focus-visible {
            outline: 3px solid #000;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <main id="main-content" role="main" aria-label="المحتوى الرئيسي">
        <!-- Main Section -->
        <section aria-labelledby="main-heading">
            <h1 id="main-heading" style="text-align: center; margin-bottom: 20px;">تطبيق إدارة المال والمهام</h1>
            
            <div class="hero-circle" role="img" aria-label="الشعار الرئيسي">
                <span style="font-size: 2rem;">⚡</span>
                <span style="font-weight: bold; font-size: 1.15rem;">الرئيسية</span>
            </div>
        </section>

        <!-- Input Page Section -->
        <section style="margin-top: 40px;" aria-labelledby="input-heading">
            <h2 id="input-heading">صفحة الإدخال</h2>
            <div class="input-card-income" aria-label="بطاقة إدخال الدخل">
                <h3>💰 إدخال الدخل (محسّنة)</h3>
                <p>تم تصغير حجم هذه البطاقة بنسبة 10% وفقاً للتصميم المطلوب.</p>
            </div>
            <div class="input-card-expense" aria-label="بطاقة إدخال المصروفات">
                <h3>💸 إدخال المصروفات</h3>
                <p>بطاقة المصروفات بالحجم الطبيعي.</p>
            </div>
        </section>

        <!-- Movements Page Section -->
        <section style="margin-top: 40px;" aria-labelledby="movements-heading">
            <h2 id="movements-heading">صفحة الحركات</h2>
            <div class="movements-container">
                <div class="movement-icon-card">
                    <span class="icon" aria-hidden="true">📥</span>
                    <span>دفعة مستلمة - مشروع تحسين الواجهة</span>
                </div>
                <div class="movement-icon-card">
                    <span class="icon" aria-hidden="true">📤</span>
                    <span>شراء مستلزمات مكتبية</span>
                </div>
            </div>
        </section>
    </main>

    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
