<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>مصاريفي</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#101728" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="مصاريفي" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { background: #101728; font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; overflow-x: hidden; }
  #root { overflow-x: hidden; }
  button:disabled { cursor: not-allowed; }

  #print-report-root { display: none; }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    body * { visibility: hidden; }
    #print-report-root, #print-report-root * { visibility: visible; }
    #print-report-root { display: block !important; position: fixed; top: 0; left: 0; width: 100%; background: #fff; }
    @page { margin: 14mm; }
  }
  .pr-page { background: #fff; color: #1B2A4A; padding: 10px; font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; direction: rtl; }
  .pr-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #1E56A0; padding-bottom: 14px; margin-bottom: 18px; }
  .pr-title { font-size: 24px; font-weight: 900; color: #1E56A0; }
  .pr-sub { font-size: 13px; color: #5C7A9A; margin-top: 4px; }
  .pr-period { text-align: left; font-size: 12px; color: #33455F; }
  .pr-period-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .pr-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 13px; }
  .pr-table th { background: #1E56A0; color: #fff; padding: 8px 10px; text-align: right; font-weight: 700; }
  .pr-table td { padding: 7px 10px; border-bottom: 1px solid #D7E3F2; }
  .pr-table tr:nth-child(even) td { background: #EAF2FB; }
  .pr-green { color: #1E8E4F; font-weight: 700; }
  .pr-red { color: #C0392B; font-weight: 700; }
  .pr-bar { background: #1E56A0; color: #fff; padding: 8px 14px; font-weight: 700; font-size: 13px; border-radius: 6px 6px 0 0; margin-top: 6px; }
  .pr-totals { margin-top: 10px; border-top: 2px solid #1E56A0; padding-top: 10px; }
  .pr-total-row { display: flex; justify-content: space-between; padding: 6px 4px; font-size: 14px; }
  .pr-grand { font-size: 17px; font-weight: 900; border-top: 1px solid #D7E3F2; margin-top: 6px; padding-top: 10px; }
  .pr-footer { margin-top: 24px; font-size: 11px; color: #8FA1C7; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
